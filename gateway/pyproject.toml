[project]
name = "llm-gateway"
version = "0.1.0"
description = "Per-user, token-metered LLM worker orchestration on k3s"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "aiosqlite>=0.20", "pyyaml>=6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
