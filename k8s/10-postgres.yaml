# Postgres for users, tokens, usage and chat history.
# k3s's built-in local-path provisioner puts the data on the host's disk
# (default: /var/lib/rancher/k3s/storage), so it survives pod restarts.
#
# Create the password secret yourself, never commit it:
#   kubectl -n llm-system create secret generic postgres-auth \
#     --from-literal=password="$(openssl rand -base64 32)"
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: llm-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70   # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: llm}
            - {name: POSTGRES_USER, value: llm}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432, name: pg}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "llm", "-d", "llm"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: llm-system
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: pg}]
